[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchgate"
version = "0.1.0"
description = "KiCad 10 lab modeling, manifest audit, and background ngspice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "kicad-tools>=0.13",
]

[project.optional-dependencies]
lab = ["pyvisa>=1.14", "pyvisa-py>=0.7", "pyserial>=3.5"]
agent = ["mcp>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
benchgate = "benchgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/benchgate"]

[tool.hatch.build.targets.wheel.sources]
"src/benchgate" = "benchgate"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
