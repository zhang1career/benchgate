# Global instrument registry — copy to ~/.benchgate/config/instruments.yaml
# (or set BENCHGATE_HOME to relocate the config root).
#
# Precedence for role bindings (highest wins):
#   CLI/Agent --scope/--dmm/--tach/--awg/--sa/--rfgen/--vna/--thermal  >  <design>/models/lab.yaml  >  this file
#
# Address overrides (machine-specific, orthogonal to role bindings):
#   BENCHGATE_INSTRUMENT_<NAME>_ADDRESS
#   BENCHGATE_<ROLE>_ADDRESS

version: 1

defaults:
  # null -> pyvisa.ResourceManager() (NI-VISA on macOS).
  # DS1104Z USB validated with system backend; @py is unreliable for this scope.
  visa_backend: null

instruments:
  scope_main:
    driver: rigol_ds1104z
    transport: visa
    address: "USB0::6833::1230::DS1ZC244706177::0::INSTR"
    options:
      timeout_ms: 10000

  dmm_bench:
    driver: uni_t_ut61e
    transport: serial
    address: "/dev/cu.PL2303G-USBtoUART14220"

  tars_disc:
    driver: tars_shell
    transport: serial_shell
    # USB product string (pyserial). Or a concrete path: "/dev/cu.usbmodem…"
    # (CDC suffix changes when the Discovery is re-plugged.)
    address: "TARS Virtual COM Port"
    options:
      baud: 115200
      assert_dtr: true

  sa8_bench:
    driver: htool_sa8
    transport: serial_scpi
    address: "/dev/cu.usbmodem5A69966405321"
    options:
      baud: 115200
      timeout_s: 3.0

  tinysa_bench:
    driver: tinysa
    transport: serial
    # USB product string "tinySA" (tinysa.org); resolves via pyserial list_ports.
    # Or set a concrete path: "/dev/cu.usbmodem4001"
    address: "tinySA"
    options:
      baud: 115200
      timeout_s: 5.0
      points: 290
      # dbm_offset: 128   # classic; Ultra auto-detected as 174 from `info`

  pico_thermal:
    driver: umeko_dec_h
    transport: serial_shell
    address: "/dev/cu.usbmodem1411201"
    options:
      baud: 115200
      timeout_s: 3.0
      assert_dtr: true

  ut372_bench:
    driver: uni_t_ut372
    transport: hid_ch9325
    # WCH CH9325 HID (needs libhidapi: brew install hidapi). Or "auto".
    address: "1a86:e008"
    options:
      baud: 2400
      timeout_s: 8.0

roles:
  scope: scope_main
  dmm: dmm_bench
  tach: ut372_bench      # UNI-T UT372 laser tachometer (RPM / count)
  awg: null              # set to tars_disc when using GPIO step stimulus
  sa: sa8_bench          # or tinysa_bench
  rfgen: sa8_bench       # or tinysa_bench
  vna: sa8_bench         # tinySA has no VNA capability
  thermal: pico_thermal  # Umeko DEC-H Heimann HTPA32x32 (raw counts)
